[workspace]
resolver = "2"
members = ["crates/synara-core","crates/synara-domain","crates/synara-config","crates/synara-platform","apps/synara-server","apps/synara-cli","apps/synara-tauri","apps/synara-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/okillsee08-oss/synara"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
