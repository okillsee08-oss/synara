[package]
name="synara-api"
version.workspace=true
edition.workspace=true
license.workspace=true

[dependencies]
axum={version="0.8",features=["ws"]}
serde.workspace=true
serde_json.workspace=true
uuid.workspace=true
tokio={version="1",features=["sync","macros"]}
anyhow.workspace=true
synara-core={path="../synara-core"}
synara-orchestrator={path="../synara-orchestrator"}
synara-protocol={path="../synara-protocol"}
synara-providers={path="../synara-providers"}
synara-transport={path="../synara-transport"}
synara-terminal={path="../synara-terminal"}
tower-http={version="0.6",features=["cors","fs"]}
