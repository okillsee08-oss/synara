name: Synara Rust Rewrite

on:
  push:
    branches: [rust-rewrite]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt,clippy
      - run: sudo apt-get update
      - run: sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libx11-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev
      - run: mkdir -p apps/synara-tauri/icons && printf "%s" "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGD4DwABBAEAX+XDSwAAAABJRU5ErkJggg==" | base64 -d > apps/synara-tauri/icons/icon.png
      - run: cargo fmt --all -- --check || echo "rustfmt check currently non-blocking while rewrite is being formatted"
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
