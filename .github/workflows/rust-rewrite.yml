name: Synara Rust Rewrite

permissions:
  contents: write

on:
  push:
    branches: [rust-rewrite, V1-Proto]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt,clippy
      - run: sudo apt-get update
      - run: sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libx11-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev
      - run: mkdir -p apps/synara-tauri/icons && printf "%s" "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGD4DwABBAEAX+XDSwAAAABJRU5ErkJggg==" | base64 -d > apps/synara-tauri/icons/icon.png
      - run: |
          git fetch origin V1-Proto
          git reset --hard origin/V1-Proto
      - run: cargo fmt --all
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: rustfmt V1 Proto"
            git push origin HEAD:V1-Proto
          fi
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
